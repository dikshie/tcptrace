name: Release CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-artifacts:
    name: Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: tcptrace-linux-x86_64
            tar_name: tcptrace-${{ github.ref_name }}-linux-x86_64.tar.gz

          - os: macos-latest
            artifact_name: tcptrace-macos-arm64
            tar_name: tcptrace-${{ github.ref_name }}-macos-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev bison flex

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison flex libpcap
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH

      - name: Ensure test scripts are executable
        run: chmod +x input/bin/*

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_WERROR=ON \
            -DCMAKE_INSTALL_PREFIX=install_dist

      - name: Build
        run: cmake --build build --config Release -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Install to distribution directory
        run: cmake --install build

      - name: Bundle release archive
        run: |
          cp README.md CHANGELOG.md COPYING install_dist/
          cd install_dist
          tar -czvf "../${{ matrix.tar_name }}" *
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.tar_name }}

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
