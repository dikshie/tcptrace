name: CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC (Release)
            os: ubuntu-latest
            cc: gcc
            sanitizers: OFF
            build_type: Release
            test_autotools: true

          - name: Ubuntu Clang (Release)
            os: ubuntu-latest
            cc: clang
            sanitizers: OFF
            build_type: Release
            test_autotools: false

          - name: Ubuntu Clang (ASan/UBSan Debug)
            os: ubuntu-latest
            cc: clang
            sanitizers: ON
            build_type: Debug
            test_autotools: false

          - name: macOS AppleClang (Release)
            os: macos-latest
            cc: clang
            sanitizers: OFF
            build_type: Release
            test_autotools: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev bison flex tzdata

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison flex libpcap
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH

      - name: Ensure test scripts are executable
        run: chmod +x input/bin/*

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_SANITIZERS=${{ matrix.sanitizers }} \
            -DENABLE_WERROR=ON

      - name: Build with CMake
        run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Run CTest Regression Suite
        env:
          TZ: America/New_York
        run: ctest --test-dir build --output-on-failure

      - name: Test Autotools Build
        if: matrix.test_autotools
        env:
          CC: ${{ matrix.cc }}
          TZ: America/New_York
        run: |
          ./configure
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make test
